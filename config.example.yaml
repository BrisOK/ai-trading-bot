exchange:
    name: binance
    apiKey: "YOUR_API_KEY_HERE"
    secret: "YOUR_SECRET_KEY_HERE"
    password: null
    testnet: true

trading:
    symbol: "BTC/USDT"
    timeframe: "1h"
    max_position_usd: 100.0
    risk_per_trade: 0.01
    sl_pct: 0.01
    tp_pct: 0.02

strategy:
    # "sma_crossover" or "ai_model"
    type: "ai_model"

    # SMA params (still available)
    fast_window: 10
    slow_window: 30

    # AI model params
    model_path: "models/ai_model.pkl"
    prob_long_threshold: 0.55     # if P(up) > this -> go long
    prob_short_threshold: 0.45    # if P(up)  < this -> go short
    min_candles: 50                         # minimum candles to build features

runtime:
    poll_interval_sec: 60
    max_candles: 500
    dry_run: true